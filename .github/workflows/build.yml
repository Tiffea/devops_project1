name: Push to DockerHub; Deploy with Ansible

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app #take the dockerfile from this dir
          push: true
          tags: tiffea/devops-project1:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: #only this part has rights to change sequrity group
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ID }}:role/github_worker
          aws-region: eu-north-1

      - name: Get runner public IP
        id: ip #tag
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT #AWS must be available

      - name: Open SSH for runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/devops-key.pem
          chmod 600 ~/.ssh/devops-key.pem
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/devops-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.SSH_HOST }} "echo connected"

      - name: Deploy with Ansible
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/site.yml \
          -e "certbot_email=${{ secrets.SECRET_EMAIL }}" -e "postgres_password=${{ secrets.POSTGRES_PASSWORD }}"

      - name: Re-configure AWS credentials before cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ID }}:role/github_worker
          aws-region: eu-north-1

      - name: Close SSH for runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}/32

# Jobs are not separated into build/deploy stages because there is only one contributor and one branch.
# change when staging environment or team is added.