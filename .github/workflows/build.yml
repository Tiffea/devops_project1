#как называется workflow в Actions
name: Build and Push docker image

#когда кто-то делает пуш в ветке main - делай jobs
on:
  push:
    branches:
      - main


jobs:
#запустить убунту; использовать модуль который скачает код на виртуальную машину
#запусть там команду сборки докер образа
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app #take the dockerfile from this dir
          push: true
          tags: tiffea/devops-project1:latest

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/devops-key.pem
          chmod 600 ~/.ssh/devops-key.pem
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Ansible
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbooks/deployment.yml


##git pull - download the newest version of app from github
##docker compose pull - download from dockerhub