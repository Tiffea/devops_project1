<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Todo List</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --accent: #c8f04c;
            --text: #f0f0f0;
            --muted: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .header {
            margin-bottom: 48px;
        }

        .header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            line-height: 1;
            color: var(--text);
            margin-bottom: 8px;
        }

        .header h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 18px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus {
            border-color: var(--accent);
        }

        button.add-btn {
            background: var(--accent);
            color: #0f0f0f;
            border: none;
            padding: 14px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.add-btn:hover {
            opacity: 0.85;
        }

        button.add-btn:active {
            transform: scale(0.97);
        }

        .count {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px 18px;
            border-radius: 8px;
            animation: fadeIn 0.2s ease;
            transition: border-color 0.2s;
        }

        .list li:hover {
            border-color: #3a3a3a;
        }

        .todo-title {
            font-size: 0.95rem;
            font-weight: 300;
        }

        button.del-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        button.del-btn:hover {
            border-color: #ff5555;
            color: #ff5555;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 48px 0;
            font-size: 0.9rem;
            font-weight: 300;
        }

        .empty span {
            display: block;
            font-size: 2rem;
            margin-bottom: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Todo<span>.</span></h1>
            <p class="subtitle">Список задач</p>
        </div>

        <div class="input-row">
            <input id="input" placeholder="Новая задача..." onkeydown="if(event.key==='Enter') addTodo()" />
            <button class="add-btn" onclick="addTodo()">Добавить</button>
        </div>

        <div class="count" id="count"></div>
        <ul class="list" id="list"></ul>
    </div>

    <script>
        async function loadTodos() {
            const res = await fetch('/todos');
            const todos = await res.json();
            const list = document.getElementById('list');
            const count = document.getElementById('count');

            count.textContent = todos.length > 0 ? `${todos.length} задач${todos.length === 1 ? 'а' : 'и'}` : '';

            if (todos.length === 0) {
                list.innerHTML = '<div class="empty"><span>✦</span>Задач пока нет</div>';
                return;
            }

            list.innerHTML = '';
            todos.forEach(t => {
                list.innerHTML += `
                    <li>
                        <span class="todo-title">${t.title}</span>
                        <button class="del-btn" onclick="deleteTodo(${t.id})">удалить</button>
                    </li>`;
            });
        }

        async function addTodo() {
            const input = document.getElementById('input');
            const title = input.value.trim();
            if (!title) return;
            await fetch('/todos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title})
            });
            input.value = '';
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch('/todos/' + id, {method: 'DELETE'});
            loadTodos();
        }

        loadTodos();
    </script>
</body>
</html>
