---
- name: install certbot
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Obtain SSL certificate
  command: >
    certbot --nginx
    -d {{ domain }}
    --non-interactive
    --agree-tos
    --email {{ email }}
  args:
    creates: /etc/letsencrypt/live/{{ domain }}/fullchain.pem