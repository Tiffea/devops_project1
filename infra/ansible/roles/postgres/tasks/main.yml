---
#1
- name: Ensure db project directory exists
  file:
    path: "{{ db_project_dir }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu

- name: copy db docker-compose-db.yml
  copy:
    content: |
      services:
        db:
          image: postgres:16
          restart: always
          ports:
            - "5432:5432"
          environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=todos
          volumes:
            - postgres_data:/var/lib/postgresql/data

      volumes:
        postgres_data:
    dest: "{{ db_project_dir }}/{{ compose_file_db }}"
    mode: '0644'
    owner: ubuntu
    group: ubuntu

- name: Create .env file with secrets
  copy:
    content: |
      POSTGRES_PASSWORD={{ postgres_password }}
    dest: "{{ db_project_dir }}/.env"
    mode: '0600'
    owner: ubuntu
    group: ubuntu

- name: Pull latest Docker images
  command: docker compose -f {{ compose_file_db }} pull
  args:
    chdir: "{{ db_project_dir }}"

- name: Start containers on first deploy
  command: docker compose -f {{ compose_file_db }} up -d
  args:
    chdir: "{{ db_project_dir }}"

- name: Check containers are running
  command: docker compose -f {{ compose_file_db }} ps
  args:
    chdir: "{{ db_project_dir }}"
  register: result


#configure AWS tools
- name: Check if AWS CLI is already installed
  command: aws --version
  register: aws_cli_check
  ignore_errors: true
  changed_when: false

- name: Download AWS CLI v2 installer
  get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}.zip"
    dest: /tmp/awscliv2.zip
  when: aws_cli_check.rc != 0

- name: Unzip AWS CLI installer
  unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: yes
  when: aws_cli_check.rc != 0

- name: Install AWS CLI
  command: /tmp/aws/install
  when: aws_cli_check.rc != 0
###


#avoid situation when script is not allowed to read root file ".env"
- name: Ensure tha db project dir exists
  file:
    path: "{{ db_project_dir}}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu

- name: Ensure backups directory exists
  file:
    path: "{{ db_project_dir }}/backups"
    state: directory
    mode: '0750'
    owner: ubuntu
    group: ubuntu

###


#script for s3 backups 
- name: Deploy backup script
  copy:
    content: |
      #!/bin/bash
      set -euo pipefail
      cd "{{ db_project_dir }}"
      TIMESTAMP=$(date +%F-%H%M%S)
      FILE="{{ db_project_dir }}/backups/todos-$TIMESTAMP.sql.gz"
      docker compose -f {{ compose_file_db }} exec -T db pg_dump -U postgres todos | gzip > "$FILE"
      aws s3 cp "$FILE" "s3://{{ backup_bucket_name }}/postgres-backups/$(basename "$FILE")"
      find "{{ db_project_dir }}/backups" -name "todos-*.sql.gz" -mtime +2 -delete
    dest: "{{ db_project_dir }}/backup.sh"
    mode: '0750'
    owner: ubuntu
    group: ubuntu

- name: Schedule nightly backup via cron
  cron:
    name: "postgres backup to s3"
    user: ubuntu
    minute: "0"
    hour: "3"
    job: "{{ db_project_dir }}/backup.sh >> {{ db_project_dir }}/backup.log 2>&1"
    ###