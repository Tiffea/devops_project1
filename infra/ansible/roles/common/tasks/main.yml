---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - git
      - unzip
    state: present
  
- name: Ensure cloud-guest-utils is installed (for growpart)
  apt:
    name: cloud-guest-utils
    state: present

- name: Grow root partition to use full disk
  command: growpart /dev/nvme0n1 1
  register: growpart_result
  changed_when: "'NOCHANGE' not in growpart_result.stdout"
  failed_when: growpart_result.rc != 0 and 'NOCHANGE' not in growpart_result.stdout

- name: Resize filesystem to match new partition size
  filesystem:
    fstype: ext4
    dev: /dev/nvme0n1p1
    resizefs: yes

- name: Check if swap file exists
  stat:
    path: /swapfile
  register: swap_file

- name: Create swap file (1G)
  command: fallocate -l 1G /swapfile
  when: not swap_file.stat.exists

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: '0600'
  when: not swap_file.stat.exists

- name: Format swap file
  command: mkswap /swapfile
  when: not swap_file.stat.exists

- name: Check if swap is already active
  command: swapon --show=NAME --noheadings
  register: swap_status
  changed_when: false

- name: Enable swap file
  command: swapon /swapfile
  when: "'/swapfile' not in swap_status.stdout"

- name: Add swap file to fstab for persistence across reboots
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present