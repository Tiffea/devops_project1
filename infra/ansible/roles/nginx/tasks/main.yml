---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default nginx config
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

    
- name: Check if SSL certificate exists
  stat:
    path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  register: ssl_cert

- name: Copy nginx config
  template:
    src: nginx.conf
    dest: /etc/nginx/sites-available/devops_project1

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/devops_project1
    dest: /etc/nginx/sites-enabled/devops_project1
    state: link

- name: Restart nginx
  service:
    name: nginx
    state: restarted
    enabled: yes